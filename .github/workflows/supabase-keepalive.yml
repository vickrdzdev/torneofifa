# Mantiene activas las bases de Supabase (plan gratuito): Supabase pausa los
# proyectos tras 7 días sin actividad. Una vez al día hace una lectura mínima
# en la base real y en la de pruebas. Usa las llaves públicas (publishable),
# que ya están en index.html y solo permiten leer.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 14 * * *"   # diario, 8:17 am hora del centro de México
  workflow_dispatch: {}      # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: real (torneofifa)
            url: https://zohacxiwuapnziicaarj.supabase.co
            key: sb_publishable_dlamj0bnGrk7VTYLZNARVQ_XfVNCAq8
          - name: pruebas (torneofifa-pruebas)
            url: https://bcvzgwnwjtcmtbhwruhi.supabase.co
            key: sb_publishable_9wJ9d3Z2o1VM6H0RgQcSaw_9h78D3bJ
    steps:
      - name: Ping ${{ matrix.name }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${{ matrix.key }}" \
              "${{ matrix.url }}/rest/v1/seasons?select=id&limit=1")
            echo "Intento $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "La base no respondió 200. Revisa si el proyecto está pausado en el panel de Supabase."
          exit 1
