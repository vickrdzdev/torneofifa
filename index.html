<style>

  .champion-banner { background: linear-gradient(135deg, rgba(231,183,93,0.16), rgba(62,203,113,0.10)); border: 1.5px solid var(--gold); border-radius: var(--radius); padding: 26px 20px; text-align: center; margin-top: 8px; }
  .champion-banner .trophy { font-size: 40px; display: block; margin-bottom: 6px; }
  .champion-banner .label { font-size: 12px; color: var(--text-muted); font-weight: 700; letter-spacing: .04em; margin-bottom: 2px; }
  .champion-banner .name { font-family: var(--font-display); font-weight: 800; font-size: 34px; color: var(--gold); }

  .toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text); padding: 11px 18px; border-radius: 10px;
    font-size: 13.5px; z-index: 50; max-width: 90vw; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .gen-btn-row { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }

  .mini-topbar { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; display: flex; gap: 6px; z-index: 15; }
  .mini-topbar .icon-btn { background: var(--surface); border: 1px solid var(--line); }

  .palm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
  .palm-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; }
  .palm-card .j { font-size: 11px; color: var(--text-muted); font-weight: 700; letter-spacing: .04em; }
  .palm-card .tr { font-size: 24px; margin: 4px 0 2px; }
  .palm-card .who { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  .palm-card.empty { opacity: 0.4; }

  .lb-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .lb-row:last-child { border-bottom: none; }
  .lb-row .rk { font-family: var(--font-display); font-weight: 700; color: var(--text-muted); width: 20px; }
  .lb-row .nm { flex: 1; font-weight: 600; }
  .lb-row .ct { font-family: var(--font-display); font-weight: 800; color: var(--gold); font-size: 17px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 640px) { .modal-overlay { align-items: center; } }
  .modal-box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 0 0; max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 640px) { .modal-box { border-radius: 16px; } }
  .modal-box h3 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0 0 14px; }
  .modal-box h4 { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin: 18px 0 6px; color: var(--accent); }
  .modal-box p, .modal-box li { font-size: 14px; line-height: 1.6; color: var(--text-muted); margin: 0 0 8px; }

<script>
(function () {
  "use strict";

  /* ============================== supabase config ============================== */
  const SUPABASE_URL = "https://zohacxiwuapnziicaarj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_dlamj0bnGrk7VTYLZNARVQ_XfVNCAq8";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const JORNADA_COUNT = 12;

  /* ============================== helpers ============================== */
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

  let toastMessage = null;
  let toastTimer = null;
  function showToast(msg) {
    toastMessage = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastMessage = null; render(); }, 3600);
  }

  let helpOpen = false;
  let loginOpen = false;
  let loginError = "";
  let activeTab = null;
  let isAdmin = false;
  let loading = true;
  let state = null; // { season, players, jornadas: [...] }

  function playerName(id) {
    const p = state.players.find(pl => pl.id === id);
    return p ? p.name : "?";
  }

  /* ============================== round robin + home balance (pure logic) ============================== */
  function priorHomeCounts(activeIds, uptoIndex) {
    const counts = {};
    activeIds.forEach(id => counts[id] = 0);
    for (let k = 0; k < uptoIndex; k++) {
      const j = state.jornadas[k];
      if (!j || !j.matches) continue;
      j.matches.forEach(m => {
        if (m.homeId && counts.hasOwnProperty(m.homeId)) counts[m.homeId]++;
      });
    }
    return counts;
  }

  function generateFixturesLocal(jIndex) {
    const jornada = state.jornadas[jIndex];
    const ids = jornada.activeIds.slice();
    let arr = ids.slice();
    if (arr.length % 2 !== 0) arr.push(null);
    const n = arr.length;
    const roundsPairs = [];
    let rot = arr.slice();
    for (let r = 0; r < n - 1; r++) {
      const pairs = [];
      for (let i = 0; i < n / 2; i++) {
        const p1 = rot[i], p2 = rot[n - 1 - i];
        if (p1 !== null && p2 !== null) pairs.push([p1, p2]);
      }
      roundsPairs.push(pairs);
      rot = [rot[0], rot[n - 1]].concat(rot.slice(1, n - 1));
    }
    const prior = priorHomeCounts(ids, jIndex);
    const local = {}; ids.forEach(id => local[id] = 0);
    const matches = [];
    let idx = 0;
    roundsPairs.forEach((pairs, rIdx) => {
      pairs.forEach(([a, b]) => {
        const totalA = prior[a] + local[a];
        const totalB = prior[b] + local[b];
        let home, away;
        if (totalA < totalB) { home = a; away = b; }
        else if (totalB < totalA) { home = b; away = a; }
        else { if (idx % 2 === 0) { home = a; away = b; } else { home = b; away = a; } }
        local[home]++;
        matches.push({
          id: null, round: rIdx + 1, homeId: home, awayId: away,
          homeGoals: null, awayGoals: null, shootoutWinnerId: null, played: false
        });
        idx++;
      });
    });
    jornada.matches = matches;
    jornada.playoff = null;
  }

  /* ============================== standings + tiebreaks (pure logic) ============================== */
  function headToHead(aId, bId, matches) {
    const m = matches.find(mm => mm.played &&
      ((mm.homeId === aId && mm.awayId === bId) || (mm.homeId === bId && mm.awayId === aId)));
    if (!m) return null;
    if (m.homeGoals === m.awayGoals) return m.shootoutWinnerId || null;
    return m.homeGoals > m.awayGoals ? m.homeId : m.awayId;
  }

  function miniTable(ids, matches) {
    const stats = {};
    ids.forEach(id => stats[id] = { pts: 0, gf: 0, gc: 0 });
    matches.forEach(m => {
      if (!m.played) return;
      if (!ids.includes(m.homeId) || !ids.includes(m.awayId)) return;
      const h = stats[m.homeId], a = stats[m.awayId];
      h.gf += m.homeGoals; h.gc += m.awayGoals;
      a.gf += m.awayGoals; a.gc += m.homeGoals;
      if (m.homeGoals > m.awayGoals) h.pts += 3;
      else if (m.awayGoals > m.homeGoals) a.pts += 3;
      else {
        if (m.shootoutWinnerId === m.homeId) { h.pts += 2; a.pts += 1; }
        else if (m.shootoutWinnerId === m.awayId) { a.pts += 2; h.pts += 1; }
        else { h.pts += 1; a.pts += 1; }
      }
    });
    return stats;
  }

  function breakTies(arr, matches) {
    arr.sort((x, y) => (y.pts - x.pts) || (y.gd - x.gd));
    const result = [];
    let i = 0;
    while (i < arr.length) {
      let j = i + 1;
      while (j < arr.length && arr[j].pts === arr[i].pts && arr[j].gd === arr[i].gd) j++;
      const group = arr.slice(i, j);
      if (group.length === 1) {
        result.push(group[0]);
      } else if (group.length === 2) {
        const w = headToHead(group[0].playerId, group[1].playerId, matches);
        if (w === group[1].playerId) result.push(group[1], group[0]);
        else result.push(group[0], group[1]);
      } else {
        const ids = group.map(g => g.playerId);
        const mt = miniTable(ids, matches);
        const sortedIds = ids.slice().sort((a, b) => {
          const pa = mt[a], pb = mt[b];
          const gdA = pa.gf - pa.gc, gdB = pb.gf - pb.gc;
          return (pb.pts - pa.pts) || (gdB - gdA) || (pb.gf - pa.gf);
        });
        sortedIds.forEach(id => result.push(group.find(g => g.playerId === id)));
      }
      i = j;
    }
    return result;
  }

  function computeStandings(jornada) {
    const stats = {};
    jornada.activeIds.forEach(id => stats[id] = { playerId: id, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, pts: 0, lc: 0 });
    jornada.matches.forEach(m => {
      if (!m.played) return;
      const h = stats[m.homeId], a = stats[m.awayId];
      if (!h || !a) return;
      h.pj++; a.pj++;
      h.gf += m.homeGoals; h.gc += m.awayGoals;
      a.gf += m.awayGoals; a.gc += m.homeGoals;
      if (m.homeGoals > m.awayGoals) { h.pg++; h.pts += 3; a.pp++; }
      else if (m.awayGoals > m.homeGoals) { a.pg++; a.pts += 3; h.pp++; }
      else {
        h.pe++; a.pe++;
        if (m.shootoutWinnerId === m.homeId) { h.pts += 2; a.pts += 1; h.lc += 1; }
        else if (m.shootoutWinnerId === m.awayId) { a.pts += 2; h.pts += 1; a.lc += 1; }
        else { h.pts += 1; a.pts += 1; }
      }
    });
    let arr = Object.values(stats);
    arr.forEach(s => s.gd = s.gf - s.gc);
    arr = breakTies(arr, jornada.matches);
    arr.forEach((s, i) => s.rank = i + 1);
    return arr;
  }

  /* ============================== playoffs (pure logic) ============================== */
  function makeKO(homeId, awayId) {
    return { id: null, homeId, awayId, homeGoals: null, awayGoals: null, shootoutWinnerId: null, played: false };
  }
  function getWinner(m) {
    if (!m || !m.played) return null;
    if (m.homeGoals > m.awayGoals) return m.homeId;
    if (m.awayGoals > m.homeGoals) return m.awayId;
    return m.shootoutWinnerId || null;
  }

  function buildPlayoff(jornada) {
    const standings = computeStandings(jornada);
    const rankOf = {};
    standings.forEach(s => rankOf[s.playerId] = s.rank);
    const ranked = standings.map(s => s.playerId);
    const N = jornada.activeIds.length;
    let pf;
    if (N === 7) {
      const [s1, s2, s3, s4, s5, s6] = ranked;
      pf = {
        type: "7", rankOf, seeds: { 1: s1, 2: s2, 3: s3, 4: s4, 5: s5, 6: s6 },
        repechaje: [makeKO(s3, s6), makeKO(s4, s5)],
        semis: [], final: null, championId: null
      };
    } else {
      const [s1, s2, s3, s4] = ranked;
      pf = {
        type: "4", rankOf, seeds: { 1: s1, 2: s2, 3: s3, 4: s4 },
        repechaje: [],
        semis: [makeKO(s1, s4), makeKO(s2, s3)],
        final: null, championId: null
      };
    }
    jornada.playoff = pf;
    advanceChain(jornada);
  }

  function advanceChain(jornada) {
    const pf = jornada.playoff;
    if (!pf) return;
    if (pf.type === "7" && pf.semis.length === 0) {
      const w1 = getWinner(pf.repechaje[0]), w2 = getWinner(pf.repechaje[1]);
      if (w1 && w2) {
        const four = [pf.seeds[1], pf.seeds[2], w1, w2].sort((a, b) => pf.rankOf[a] - pf.rankOf[b]);
        pf.semis = [makeKO(four[0], four[3]), makeKO(four[1], four[2])];
      }
    }
    if (pf.semis.length === 2 && !pf.final) {
      const w1 = getWinner(pf.semis[0]), w2 = getWinner(pf.semis[1]);
      if (w1 && w2) {
        const home = pf.rankOf[w1] <= pf.rankOf[w2] ? w1 : w2;
        const away = home === w1 ? w2 : w1;
        pf.final = makeKO(home, away);
      }
    }
    if (pf.final) pf.championId = getWinner(pf.final);
  }

  /* ============================== supabase data layer ============================== */
  function mapMatchRow(r) {
    return { id: r.id, round: r.round, homeId: r.home_id, awayId: r.away_id, homeGoals: r.home_goals, awayGoals: r.away_goals, shootoutWinnerId: r.shootout_winner_id, played: r.played };
  }

  async function loadSeasonData() {
    const { data: seasons, error: e1 } = await sb.from("seasons").select("*").eq("is_active", true).order("created_at", { ascending: false }).limit(1);
    if (e1) { showToast("No se pudo cargar la temporada."); state = null; return; }
    if (!seasons || !seasons.length) { state = null; return; }
    const season = seasons[0];

    const { data: players } = await sb.from("players").select("*").eq("season_id", season.id).order("sort_order");
    const { data: jornadasRows } = await sb.from("jornadas").select("*").eq("season_id", season.id).order("jornada_number");
    const jornadaIds = (jornadasRows || []).map(j => j.id);

    let attendance = [], matches = [];
    if (jornadaIds.length) {
      const [attRes, matRes] = await Promise.all([
        sb.from("jornada_attendance").select("*").in("jornada_id", jornadaIds),
        sb.from("matches").select("*").in("jornada_id", jornadaIds)
      ]);
      attendance = attRes.data || [];
      matches = matRes.data || [];
    }

    const jornadas = (jornadasRows || []).map(jr => {
      const activeIds = attendance.filter(a => a.jornada_id === jr.id).map(a => a.player_id);
      const allM = matches.filter(m => m.jornada_id === jr.id);
      const groupM = allM.filter(m => m.stage === "group").sort((a, b) => (a.round || 0) - (b.round || 0));
      const repM = allM.filter(m => m.stage === "repechaje");
      const semiM = allM.filter(m => m.stage === "semifinal");
      const finalM = allM.find(m => m.stage === "final") || null;

      let playoff = null;
      if (repM.length || semiM.length || finalM) {
        const finalMapped = finalM ? mapMatchRow(finalM) : null;
        playoff = {
          type: repM.length ? "7" : "4",
          rankOf: {},
          repechaje: repM.map(mapMatchRow),
          semis: semiM.map(mapMatchRow),
          final: finalMapped,
          championId: finalMapped ? getWinner(finalMapped) : null
        };
      }
      return {
        id: jr.id, jornada_number: jr.jornada_number, label: jr.label,
        activeIds, matches: groupM.map(mapMatchRow), playoff
      };
    });

    state = { season, players: players || [], jornadas };
  }

  function flattenJornadaForPersist(jornada) {
    const rows = jornada.matches.map(m => ({
      jornada_id: jornada.id, stage: "group", round: m.round,
      home_id: m.homeId, away_id: m.awayId, home_goals: m.homeGoals, away_goals: m.awayGoals,
      shootout_winner_id: m.shootoutWinnerId, played: m.played
    }));
    if (jornada.playoff) {
      jornada.playoff.repechaje.forEach(m => rows.push({
        jornada_id: jornada.id, stage: "repechaje", round: null,
        home_id: m.homeId, away_id: m.awayId, home_goals: m.homeGoals, away_goals: m.awayGoals,
        shootout_winner_id: m.shootoutWinnerId, played: m.played
      }));
      jornada.playoff.semis.forEach(m => rows.push({
        jornada_id: jornada.id, stage: "semifinal", round: null,
        home_id: m.homeId, away_id: m.awayId, home_goals: m.homeGoals, away_goals: m.awayGoals,
        shootout_winner_id: m.shootoutWinnerId, played: m.played
      }));
      if (jornada.playoff.final) {
        const f = jornada.playoff.final;
        rows.push({
          jornada_id: jornada.id, stage: "final", round: null,
          home_id: f.homeId, away_id: f.awayId, home_goals: f.homeGoals, away_goals: f.awayGoals,
          shootout_winner_id: f.shootoutWinnerId, played: f.played
        });
      }
    }
    return rows;
  }

  async function persistJornada(jornada) {
    try {
      await sb.from("matches").delete().eq("jornada_id", jornada.id);
      const rows = flattenJornadaForPersist(jornada);
      if (rows.length) {
        const { error } = await sb.from("matches").insert(rows);
        if (error) throw error;
      }
    } catch (e) {
      showToast("No se pudo guardar el cambio. Intenta de nuevo.");
    }
    await loadSeasonData();
    render();
  }

  /* ============================== mutation handlers ============================== */
  async function toggleAttendance(jornadaId, playerId) {
    if (!isAdmin) return;
    const j = state.jornadas.find(x => x.id === jornadaId);
    if (j.matches.length > 0) return;
    const isActive = j.activeIds.includes(playerId);
    try {
      if (isActive) await sb.from("jornada_attendance").delete().eq("jornada_id", jornadaId).eq("player_id", playerId);
      else await sb.from("jornada_attendance").insert({ jornada_id: jornadaId, player_id: playerId });
    } catch (e) { showToast("No se pudo actualizar la asistencia."); }
    await loadSeasonData(); render();
  }

  async function generateJornada(jornadaId) {
    if (!isAdmin) return;
    const jIndex = state.jornadas.findIndex(x => x.id === jornadaId);
    const j = state.jornadas[jIndex];
    if (j.activeIds.length < 4) return;
    generateFixturesLocal(jIndex);
    await persistJornada(j);
  }

  async function resetJornada(jornadaId) {
    if (!isAdmin) return;
    if (!confirm("¿Reiniciar esta Jornada? Se borrarán los partidos y la Liguilla generados.")) return;
    const j = state.jornadas.find(x => x.id === jornadaId);
    j.matches = []; j.playoff = null;
    await persistJornada(j);
  }

  async function setGroupGoal(jornadaId, matchId, side, value) {
    if (!isAdmin) return;
    const j = state.jornadas.find(x => x.id === jornadaId);
    const m = j.matches.find(x => x.id === matchId);
    if (!m) return;
    const v = value === "" ? null : Math.max(0, parseInt(value, 10) || 0);
    if (side === "home") m.homeGoals = v; else m.awayGoals = v;
    if (m.homeGoals !== m.awayGoals) m.shootoutWinnerId = null;
    m.played = m.homeGoals !== null && m.awayGoals !== null && (m.homeGoals !== m.awayGoals || !!m.shootoutWinnerId);
    if (j.playoff) { j.playoff = null; showToast("Cambiaste un resultado de la fase de grupos — se reinició la Liguilla de esta Jornada."); }
    await persistJornada(j);
  }

  async function setGroupShootout(jornadaId, matchId, winnerId) {
    if (!isAdmin) return;
    const j = state.jornadas.find(x => x.id === jornadaId);
    const m = j.matches.find(x => x.id === matchId);
    if (!m) return;
    m.shootoutWinnerId = winnerId;
    m.played = m.homeGoals !== null && m.awayGoals !== null;
    await persistJornada(j);
  }

  function findKO(jornada, matchId) {
    const pf = jornada.playoff;
    if (!pf) return null;
    const all = pf.repechaje.concat(pf.semis, pf.final ? [pf.final] : []);
    return all.find(m => m.id === matchId) || null;
  }
  function cascadeClear(jornada, changedId) {
    const pf = jornada.playoff;
    if (!pf) return;
    const isRep = pf.repechaje.some(m => m.id === changedId);
    const isSemi = pf.semis.some(m => m.id === changedId);
    if (isRep) { pf.semis = []; pf.final = null; pf.championId = null; }
    else if (isSemi) { pf.final = null; pf.championId = null; }
    else { pf.championId = null; }
  }

  async function setKOGoal(jornadaId, matchId, side, value) {
    if (!isAdmin) return;
    const j = state.jornadas.find(x => x.id === jornadaId);
    const m = findKO(j, matchId);
    if (!m) return;
    const v = value === "" ? null : Math.max(0, parseInt(value, 10) || 0);
    if (side === "home") m.homeGoals = v; else m.awayGoals = v;
    if (m.homeGoals !== m.awayGoals) m.shootoutWinnerId = null;
    m.played = m.homeGoals !== null && m.awayGoals !== null && (m.homeGoals !== m.awayGoals || !!m.shootoutWinnerId);
    cascadeClear(j, matchId);
    advanceChain(j);
    await persistJornada(j);
  }

  async function setKOShootout(jornadaId, matchId, winnerId) {
    if (!isAdmin) return;
    const j = state.jornadas.find(x => x.id === jornadaId);
    const m = findKO(j, matchId);
    if (!m) return;
    m.shootoutWinnerId = winnerId;
    m.played = m.homeGoals !== null && m.awayGoals !== null;
    cascadeClear(j, matchId);
    advanceChain(j);
    await persistJornada(j);
  }

  async function generateLiguilla(jornadaId) {
    if (!isAdmin) return;
    const j = state.jornadas.find(x => x.id === jornadaId);
    buildPlayoff(j);
    await persistJornada(j);
  }

  async function createSeason(name, playerNames) {
    if (!isAdmin) return;
    try {
      const { data: seasonRows, error: e1 } = await sb.from("seasons").insert({ name, is_active: true }).select();
      if (e1) throw e1;
      const season = seasonRows[0];
      const jornadaRows = [];
      for (let i = 0; i < JORNADA_COUNT; i++) jornadaRows.push({ season_id: season.id, jornada_number: i, label: "J" + i });
      const { data: insertedJornadas, error: e2 } = await sb.from("jornadas").insert(jornadaRows).select("id");
      if (e2) throw e2;
      const playerRows = playerNames.map((n, i) => ({ season_id: season.id, name: n, sort_order: i }));
      const { data: insertedPlayers, error: e3 } = await sb.from("players").insert(playerRows).select("id");
      if (e3) throw e3;
      // Asistencia por default: todos los jugadores marcados en todas las Jornadas.
      const attendanceRows = insertedJornadas.flatMap(jr => insertedPlayers.map(p => ({ jornada_id: jr.id, player_id: p.id })));
      const { error: e4 } = await sb.from("jornada_attendance").insert(attendanceRows);
      if (e4) throw e4;
    } catch (e) {
      showToast("No se pudo crear la temporada. Intenta de nuevo.");
    }
    await loadSeasonData(); render();
  }

  async function newSeasonFlow() {
    if (!isAdmin || !state) return;
    if (!confirm("¿Cerrar esta temporada y empezar una nueva? El historial de esta temporada se conserva, solo deja de ser la activa.")) return;
    try { await sb.from("seasons").update({ is_active: false }).eq("id", state.season.id); } catch (e) { /* ignore */ }
    state = null;
    render();
  }

  function downloadBackup() {
    if (!state) return;
    try {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "torneo-" + (state.season.name || "temporada") + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) { showToast("No se pudo generar el respaldo."); }
  }

  function renderSetup() {
    const app = $("#app");
    const chosen = renderSetup._count || 6;
    const names = renderSetup._names || [];
    const seasonName = renderSetup._seasonName != null ? renderSetup._seasonName : "FC27";
    const opts = [7, 6, 5, 4];
    const locked = !isAdmin;
    const cardHtml = locked ? `
        <div class="setup-card" style="margin-top:-26px; text-align:center;">
          <h2>Todavía no hay una temporada activa</h2>
          <p class="hint">Si eres el admin, inicia sesión para crearla. Si no, espera a que el admin la configure — vas a poder verla en cuanto exista.</p>
          <button class="btn-primary" data-action="open-login" style="max-width:280px; margin:0 auto;">Iniciar sesión como admin</button>
        </div>
    ` : `
        <div class="setup-card" style="margin-top:-26px;">
          <h2>Nombre de la temporada</h2>
          <div class="name-row" style="margin-bottom:22px;">
            <input class="text-input" id="season-name" type="text" placeholder="FC27" value="${escapeHtml(seasonName)}">
          </div>
          <h2>¿Cuántos jugadores participan?</h2>
          <p class="hint">Total de jugadores de la temporada. Si alguien falta algún mes, ajustas la asistencia por Jornada.</p>
          <div class="count-row">
            ${opts.map(n => `<button class="count-btn ${n === chosen ? "active" : ""}" data-action="pick-count" data-n="${n}">${n}<span class="lbl">jugadores</span></button>`).join("")}
          </div>
          <h2>Nombres</h2>
          <div class="name-grid">
            ${Array.from({ length: chosen }, (_, i) => `
              <div class="name-row">
                <span class="num">${i + 1}</span>
                <input class="text-input" data-action="name-input" data-i="${i}" type="text" placeholder="Jugador ${i + 1}" value="${escapeHtml(names[i] || "")}">
              </div>`).join("")}
          </div>
          <button class="btn-primary" data-action="create-tournament">Crear torneo →</button>
        </div>
    `;
    app.innerHTML = `
      <div class="mini-topbar">
        <button class="icon-btn" title="${isAdmin ? "Cerrar sesión admin" : "Entrar como admin"}" data-action="${isAdmin ? "admin-logout" : "open-login"}">${isAdmin ? "🔓" : "🔒"}</button>
      </div>
      <div class="hero">
        <div class="hero-inner">
          ${pitchArtSVG()}
          <h1>Torneo FIFA Team</h1>
          <p class="lead">12 Jornadas, tabla de posiciones, desempate por penales estilo "Leagues Cup" y Liguilla automática — con los datos sincronizados para todos.</p>
        </div>
      </div>
      <div class="wrap">${cardHtml}</div>
      ${helpModalHtml()}
      ${loginModalHtml()}
      ${toastMessage ? `<div class="toast">${escapeHtml(toastMessage)}</div>` : ""}
    `;
    if (!locked) {
      $all('[data-action="name-input"]', app).forEach(inp => {
        inp.addEventListener("input", (e) => {
          const i = parseInt(e.target.dataset.i, 10);
          renderSetup._names = renderSetup._names || [];
          renderSetup._names[i] = e.target.value;
        });
      });
      const sn = $("#season-name", app);
      if (sn) sn.addEventListener("input", (e) => { renderSetup._seasonName = e.target.value; });
    }
  }

  /* ============================== render: match/table pieces ============================== */
  function scoreInputsHtml(m, onGoalAction, jornadaId) {
    const hv = m.homeGoals === null ? "" : m.homeGoals;
    const av = m.awayGoals === null ? "" : m.awayGoals;
    const dis = isAdmin ? "" : "disabled";
    return `
      <div class="score-inputs">
        <input class="score-box" type="number" min="0" inputmode="numeric" value="${hv}" ${dis}
          data-action="${onGoalAction}" data-j="${jornadaId}" data-match="${m.id}" data-side="home">
        <span class="score-sep">–</span>
        <input class="score-box" type="number" min="0" inputmode="numeric" value="${av}" ${dis}
          data-action="${onGoalAction}" data-j="${jornadaId}" data-match="${m.id}" data-side="away">
      </div>
      <span class="match-played-badge">${m.played ? "✓" : ""}</span>
    `;
  }

  function shootoutHtml(m, jornadaId, onPickAction, isKnockout) {
    if (m.homeGoals === null || m.awayGoals === null || m.homeGoals !== m.awayGoals) return "";
    const label = isKnockout
      ? "Empate — definición por penales, ¿quién avanza?"
      : "Empate — desempate \u201cLeagues Cup\u201d por penales, ¿quién gana la serie?";
    const dis = isAdmin ? "" : "disabled";
    return `
      <div class="shootout-bar">
        <span class="label">${label}</span>
        <button class="pk-btn ${m.shootoutWinnerId === m.homeId ? "selected" : ""}" ${dis} data-action="${onPickAction}" data-j="${jornadaId}" data-match="${m.id}" data-winner="${m.homeId}">${escapeHtml(playerName(m.homeId))}</button>
        <button class="pk-btn ${m.shootoutWinnerId === m.awayId ? "selected" : ""}" ${dis} data-action="${onPickAction}" data-j="${jornadaId}" data-match="${m.id}" data-winner="${m.awayId}">${escapeHtml(playerName(m.awayId))}</button>
        ${m.shootoutWinnerId && !isKnockout ? '<span class="pk-tag">+2 / +1 PTS</span>' : ""}
      </div>
    `;
  }

  function matchCardHtml(m, jornadaId, isKnockout) {
    const goalAction = isKnockout ? "ko-goal" : "group-goal";
    const pickAction = isKnockout ? "ko-pk" : "group-pk";
    return `
      <div class="match-card">
        <div class="match-side home">
          <span class="match-name">${escapeHtml(playerName(m.homeId))}</span>
        </div>
        ${scoreInputsHtml(m, goalAction, jornadaId)}
        <div class="match-side away">
          <span class="match-name">${escapeHtml(playerName(m.awayId))}</span>
        </div>
      </div>
      ${shootoutHtml(m, jornadaId, pickAction, isKnockout)}
    `;
  }

  function standingsTableHtml(standings, qualifyCount) {
    const rows = standings.map(s => `
      <tr class="${s.rank <= qualifyCount ? "qualifies" : ""}">
        <td class="pos-cell">${s.rank}</td>
        <td class="name-cell">${escapeHtml(playerName(s.playerId))}</td>
        <td>${s.pj}</td><td>${s.pg}</td><td>${s.pe}</td><td>${s.pp}</td>
        <td>${s.gf}</td><td>${s.gc}</td><td>${s.gd > 0 ? "+" + s.gd : s.gd}</td>
        <td>${s.lc > 0 ? "+" + s.lc : "–"}</td>
        <td class="pts-cell">${s.pts}</td>
      </tr>`).join("");
    return `
      <div class="table-scroll">
        <table class="standings">
          <thead><tr>
            <th>#</th><th style="text-align:left">Jugador</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th>
            <th>GF</th><th>GC</th><th>DG</th><th>LC</th><th>Pts</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p class="qual-note">LC = puntos extra ganados en series de penales (desempate "Leagues Cup").</p>
      ${qualifyCount > 0 ? `<p class="qual-note"><span class="qual-dot"></span>Los primeros ${qualifyCount} avanzan a la Liguilla.</p>` : ""}
    `;
  }

  /* ============================== render: jornada pane ============================== */
  function renderAttendanceStage(j) {
    const enough = j.activeIds.length >= 4;
    const locked = !isAdmin;
    return `
      <div class="card">
        <h2 style="font-family:var(--font-display);font-weight:700;font-size:20px;margin:0 0 4px;">Asistencia — ${j.label}</h2>
        <p class="attend-note">Marca quiénes juegan esta Jornada (mínimo 4). El calendario y la Liguilla se generan según quién participe.</p>
        ${locked ? `<p class="lock-note">🔒 Solo el admin puede editar la asistencia.</p>` : ""}
        <div class="attend-list">
          ${state.players.map(p => `
            <label class="attend-chip ${locked ? "disabled" : ""}">
              <input type="checkbox" data-action="toggle-attendance" data-j="${j.id}" data-p="${p.id}" ${j.activeIds.includes(p.id) ? "checked" : ""} ${locked ? "disabled" : ""}>
              ${escapeHtml(p.name)}
            </label>`).join("")}
        </div>
        ${!enough && !locked ? '<p class="attend-warn">Selecciona al menos 4 jugadores.</p>' : ""}
        ${!locked ? `<button class="btn-primary" data-action="generate-jornada" data-j="${j.id}" ${enough ? "" : "disabled"} style="max-width:280px;">Generar calendario</button>` : ""}
      </div>
    `;
  }

  function renderGroupStage(j) {
    const rounds = {};
    j.matches.forEach(m => { (rounds[m.round] = rounds[m.round] || []).push(m); });
    const roundKeys = Object.keys(rounds).map(Number).sort((a, b) => a - b);
    const standings = computeStandings(j);
    const allPlayed = j.matches.every(m => m.played);
    const N = j.activeIds.length;
    const qualifyCount = N === 7 ? 6 : 4;

    return `
      <div class="section">
        <div class="section-head">
          <h2>Fase de grupos</h2>
          <span class="sub">Todos contra todos · ${j.matches.length} partidos</span>
        </div>
        ${roundKeys.map(rk => `
          <div class="round-block">
            <p class="round-label">Fecha ${rk}</p>
            ${rounds[rk].map(m => matchCardHtml(m, j.id, false)).join("")}
          </div>
        `).join("")}
        ${isAdmin ? `<div class="gen-btn-row">
          <button class="btn-secondary" data-action="reset-jornada" data-j="${j.id}">↺ Reiniciar Jornada</button>
        </div>` : ""}
      </div>
      <div class="section">
        <div class="section-head"><h2>Tabla de posiciones</h2></div>
        ${standingsTableHtml(standings, allPlayed ? qualifyCount : 0)}
        ${allPlayed && !j.playoff && isAdmin ? `<div class="gen-btn-row"><button class="btn-primary" style="width:auto;" data-action="generate-liguilla" data-j="${j.id}">Generar Liguilla →</button></div>` : ""}
        ${!allPlayed ? `<p class="qual-note">Captura todos los resultados para desbloquear la Liguilla.</p>` : ""}
      </div>
    `;
  }

  function koMatchBlock(title, m, jornadaId, rankLabel) {
    if (!m) return "";
    return `
      <div>
        <p class="round-label">${title}${rankLabel ? " · " + rankLabel : ""}</p>
        ${matchCardHtml(m, jornadaId, true)}
      </div>
    `;
  }

  function renderPlayoff(j) {
    const pf = j.playoff;
    if (!pf) return "";
    const standings = computeStandings(j);
    const rankOf = {}; standings.forEach(s => rankOf[s.playerId] = s.rank);
    const rk = (id) => "#" + rankOf[id];
    let html = `<div class="section"><div class="section-head"><h2>Liguilla de la Jornada</h2><span class="sub">${pf.type === "7" ? "Repechaje + Semifinales + Final" : "Semifinales + Final"}</span></div>`;

    if (pf.type === "7") {
      html += `<div class="bracket-stage"><p class="stage-title">Repechaje (directo, sin empate)</p>
        <div class="bracket-grid two-col">
          ${koMatchBlock("3° vs 6°", pf.repechaje[0], j.id, rk(pf.repechaje[0].homeId) + " vs " + rk(pf.repechaje[0].awayId))}
          ${koMatchBlock("4° vs 5°", pf.repechaje[1], j.id, rk(pf.repechaje[1].homeId) + " vs " + rk(pf.repechaje[1].awayId))}
        </div></div>`;
    }
    if (pf.semis.length === 2) {
      html += `<div class="bracket-stage"><p class="stage-title">Semifinales</p>
        <div class="bracket-grid two-col">
          ${koMatchBlock("Semifinal 1", pf.semis[0], j.id, rk(pf.semis[0].homeId) + " vs " + rk(pf.semis[0].awayId))}
          ${koMatchBlock("Semifinal 2", pf.semis[1], j.id, rk(pf.semis[1].homeId) + " vs " + rk(pf.semis[1].awayId))}
        </div></div>`;
    } else if (pf.type === "7") {
      html += `<p class="qual-note">Las semifinales se arman cuando termine el Repechaje.</p>`;
    }
    if (pf.final) {
      html += `<div class="bracket-stage"><p class="stage-title">Final</p>${matchCardHtml(pf.final, j.id, true)}</div>`;
    } else if (pf.semis.length === 2) {
      html += `<p class="qual-note">La Final se arma cuando terminen las Semifinales.</p>`;
    }
    if (pf.championId) {
      html += `<div class="champion-banner">
        <span class="trophy">🏆</span>
        <div class="label">Campeón de ${j.label}</div>
        <div class="name">${escapeHtml(playerName(pf.championId))}</div>
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  function jornadaStatus(j) {
    if (j.matches.length === 0) return "pending";
    if (j.playoff && j.playoff.championId) return "done";
    return "progress";
  }

  /* ============================== render: palmares ============================== */
  function renderPalmares() {
    const titles = {};
    state.players.forEach(p => titles[p.id] = 0);
    const champs = state.jornadas.map(j => {
      const champ = j.playoff && j.playoff.championId;
      if (champ) titles[champ] = (titles[champ] || 0) + 1;
      return { label: j.label, champ };
    });
    const board = state.players.slice().sort((a, b) => titles[b.id] - titles[a.id]);
    return `
      <div class="section">
        <div class="section-head"><h2>Palmarés de la temporada</h2></div>
        <div class="palm-grid">
          ${champs.map(c => `
            <div class="palm-card ${c.champ ? "" : "empty"}">
              <div class="j">${c.label}</div>
              <div class="tr">${c.champ ? "🏆" : "—"}</div>
              <div class="who">${c.champ ? escapeHtml(playerName(c.champ)) : "Pendiente"}</div>
            </div>`).join("")}
        </div>
        <div class="leaderboard card">
          <h2 style="font-family:var(--font-display);font-weight:700;font-size:18px;margin:0 0 6px;">Títulos por jugador</h2>
          ${board.map((p, i) => `
            <div class="lb-row">
              <span class="rk">${i + 1}</span>
              <span class="nm">${escapeHtml(p.name)}</span>
              <span class="ct">${titles[p.id]}</span>
            </div>`).join("")}
        </div>
      </div>
    `;
  }

  /* ============================== render: help + login modals ============================== */
  function helpModalHtml() {
    if (!helpOpen) return "";
    return `
    <div class="modal-overlay">
      <div class="modal-box" data-stop-close>
        <h3>Cómo funciona el torneo</h3>
        <h4>Puntos por Jornada</h4>
        <p>Triunfo = <strong>3 pts</strong>, empate = <strong>1 pt</strong>, derrota = <strong>0 pts</strong>.</p>
        <h4>Desempate "Leagues Cup"</h4>
        <p>Si un partido de fase de grupos termina empatado, se define con una serie de penales directa (sin tiempos extra). El ganador se lleva <strong>1 punto extra</strong> además del de empate (2 pts en total); el perdedor conserva su punto de empate (1 pt). El marcador de penales no afecta la diferencia de goles, solo el resultado directo.</p>
        <h4>Criterios de desempate en la tabla</h4>
        <ol>
          <li>Puntos</li>
          <li>Diferencia de goles</li>
          <li>Resultado directo (incluye el desempate de penales)</li>
          <li>Goles a favor <span style="opacity:.7">(criterio adicional por si el empate persiste)</span></li>
        </ol>
        <h4>Liguilla</h4>
        <p><strong>Con 7 jugadores activos:</strong> pasan los mejores 6. 1° y 2° van directo a semifinales; 3° vs 6° y 4° vs 5° juegan un repechaje directo (con penales si hay empate). Las semifinales siempre enfrentan al mejor ubicado contra el peor ubicado disponible.</p>
        <p><strong>Con 4, 5 o 6 jugadores activos:</strong> pasan los mejores 4, directo a semifinales: 1° vs 4° y 2° vs 3°.</p>
        <p>En la Liguilla, el jugador mejor ubicado en la tabla siempre es local.</p>
        <h4>Localía</h4>
        <p>El calendario reparte la localía lo más parejo posible entre partidos, tomando en cuenta cuántas veces ya jugó de local cada jugador en Jornadas anteriores de la temporada.</p>
        <h4>Tus datos</h4>
        <p>Todo se guarda en una base de datos real y se sincroniza al instante entre todos los que tengan la app abierta. Solo el admin puede editar; el resto puede ver todo en vivo sin iniciar sesión.</p>
        <div class="modal-close-row"><button class="btn-secondary" data-action="close-help">Cerrar</button></div>
      </div>
    </div>`;
  }

  function loginModalHtml() {
    if (!loginOpen) return "";
    return `
    <div class="modal-overlay">
      <div class="modal-box" data-stop-close>
        <h3>Acceso de administrador</h3>
        <p>Solo el admin puede capturar resultados, marcar asistencia, generar la Liguilla y crear temporadas. Los demás pueden ver todo en vivo sin iniciar sesión.</p>
        <div class="name-row" style="margin-bottom:10px;">
          <input class="text-input" id="login-user" type="email" placeholder="Correo" autocomplete="username">
        </div>
        <div class="name-row" style="margin-bottom:6px;">
          <input class="text-input" id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password">
        </div>
        ${loginError ? `<p style="color:var(--red); font-size:13px; margin:0 0 10px;">${escapeHtml(loginError)}</p>` : ""}
        <button class="btn-primary" data-action="submit-login">Entrar</button>
        <div class="modal-close-row"><button class="btn-secondary" data-action="close-login">Cancelar</button></div>
      </div>
    </div>`;
  }

  /* ============================== render: dashboard ============================== */
  function renderDashboard() {
    const app = $("#app");
    if (!activeTab) activeTab = state.jornadas[0].label;
    const isPalmares = activeTab === "palmares";
    const j = isPalmares ? null : state.jornadas.find(x => x.label === activeTab);

    let body = "";
    if (isPalmares) body = renderPalmares();
    else if (j.matches.length === 0) body = renderAttendanceStage(j);
    else body = renderGroupStage(j) + renderPlayoff(j);

    app.innerHTML = `
      <div class="topbar">
        <div class="topbar-inner">
          <div class="brand"><span class="dot live"></span>${escapeHtml(state.season.name)}</div>
          <div class="topbar-actions">
            <button class="icon-btn" title="Reglas" data-action="open-help">ℹ️</button>
            <button class="icon-btn" title="Descargar respaldo" data-action="download-backup">⭳</button>
            ${isAdmin
              ? `<button class="icon-btn" title="Cerrar sesión admin" data-action="admin-logout">🔓</button>
                 <button class="icon-btn" title="Nueva temporada" data-action="new-season">⟲</button>`
              : `<button class="icon-btn" title="Entrar como admin" data-action="open-login">🔒</button>`
            }
          </div>
        </div>
        <div class="tabs">
          ${state.jornadas.map(jj => {
            const st = jornadaStatus(jj);
            return `<button class="tab-btn ${st} ${activeTab === jj.label ? "active" : ""}" data-action="set-tab" data-tab="${jj.label}"><span class="flag"></span>${jj.label}</button>`;
          }).join("")}
          <button class="tab-btn ${activeTab === "palmares" ? "active" : ""}" data-action="set-tab" data-tab="palmares">🏆 Palmarés</button>
        </div>
      </div>
      <div class="wrap" style="padding-top:20px;">${body}</div>
      ${helpModalHtml()}
      ${loginModalHtml()}
      ${toastMessage ? `<div class="toast">${escapeHtml(toastMessage)}</div>` : ""}
    `;
  }

  /* ============================== root render + delegation ============================== */
  function render() {
    if (loading) {
      $("#app").innerHTML = `<div class="loading-screen">Cargando torneo…</div>`;
      return;
    }
    if (!state) { renderSetup(); return; }
    renderDashboard();
  }

  document.addEventListener("click", (e) => {
    const overlay = e.target.closest(".modal-overlay");
    if (overlay && !e.target.closest("[data-stop-close]")) { helpOpen = false; loginOpen = false; render(); return; }

    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;

    switch (action) {
      case "pick-count": {
        renderSetup._count = parseInt(el.dataset.n, 10);
        renderSetup._names = renderSetup._names || [];
        render();
        break;
      }
      case "create-tournament": {
        if (!isAdmin) break;
        const n = renderSetup._count || 6;
        const names = [];
        for (let i = 0; i < n; i++) {
          const v = (renderSetup._names && renderSetup._names[i]) ? renderSetup._names[i].trim() : "";
          names.push(v || ("Jugador " + (i + 1)));
        }
        const seasonName = (renderSetup._seasonName || "").trim() || "FC27";
        loading = true; render();
        createSeason(seasonName, names).then(() => { loading = false; render(); });
        break;
      }
      case "toggle-attendance": toggleAttendance(el.dataset.j, el.dataset.p); break;
      case "generate-jornada": generateJornada(el.dataset.j); break;
      case "reset-jornada": resetJornada(el.dataset.j); break;
      case "generate-liguilla": generateLiguilla(el.dataset.j); break;
      case "group-pk": setGroupShootout(el.dataset.j, el.dataset.match, el.dataset.winner); break;
      case "ko-pk": setKOShootout(el.dataset.j, el.dataset.match, el.dataset.winner); break;
      case "set-tab": activeTab = el.dataset.tab; render(); break;
      case "open-help": helpOpen = true; render(); break;
      case "close-help": helpOpen = false; render(); break;
      case "download-backup": downloadBackup(); break;
      case "new-season": newSeasonFlow(); break;
      case "open-login": loginOpen = true; loginError = ""; render(); break;
      case "close-login": loginOpen = false; loginError = ""; render(); break;
      case "submit-login": submitLogin(); break;
      case "admin-logout": adminLogout(); break;
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.target.id === "login-user" || e.target.id === "login-pass")) {
      e.preventDefault();
      submitLogin();
    }
  });

  document.addEventListener("change", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    if (action === "group-goal") setGroupGoal(el.dataset.j, el.dataset.match, el.dataset.side, el.value);
    else if (action === "ko-goal") setKOGoal(el.dataset.j, el.dataset.match, el.dataset.side, el.value);
  });

  /* ============================== init ============================== */
  async function init() {
    render(); // loading screen
    const { data: { session } } = await sb.auth.getSession();
    isAdmin = !!session;
    sb.auth.onAuthStateChange((_event, newSession) => {
      const was = isAdmin;
      isAdmin = !!newSession;
      if (was !== isAdmin) render();
    });
    await loadSeasonData();
    loading = false;
    subscribeRealtime();
    render();
  }
  init();
})();
</script>
</body>
</html>
